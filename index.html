<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="MCN Elektrotechniek — onze vernieuwde website is binnenkort beschikbaar.">
  <title>MCN Elektrotechniek | Binnenkort beschikbaar</title>
  <style>
    :root { color-scheme: dark; --bg:#101010; --orange:#ff6b18; --blue:#35a9eb; --text:#f5f5f5; --muted:#b7b7b7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; overflow:hidden; color:var(--text); background:radial-gradient(ellipse at 50% 40%, #25201c 0, var(--bg) 62%); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body::before { content:""; position:fixed; inset:-30%; pointer-events:none; opacity:.13; background:repeating-radial-gradient(ellipse at 50% 50%, transparent 0 25px, #737373 26px 27px, transparent 28px 48px); transform:rotate(-13deg); }
    main { position:relative; width:min(100%, 720px); text-align:center; padding:clamp(28px, 7vw, 64px); border:1px solid #ffffff18; border-radius:28px; background:linear-gradient(145deg, #1b1b1bee, #121212f2); box-shadow:0 28px 90px #0009; }
    .logo { display:block; width:min(100%, 520px); height:auto; margin:0 auto 36px; border-radius:12px; }
    .eyebrow { display:inline-flex; align-items:center; gap:10px; margin-bottom:18px; color:var(--orange); font-size:.78rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--blue); box-shadow:0 0 15px var(--blue); }
    h1 { margin:0; font-size:clamp(2.35rem, 8vw, 4.6rem); line-height:.98; letter-spacing:-.055em; }
    h1 span { color:var(--orange); }
    p { max-width:470px; margin:22px auto 0; color:var(--muted); font-size:clamp(1rem, 2.8vw, 1.14rem); line-height:1.7; }
    .rule { width:54px; height:3px; margin:30px auto 0; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--orange)); }
    footer { position:relative; margin-top:26px; color:#777; font-size:.78rem; letter-spacing:.04em; }
    @media (max-width:480px) { body { padding:16px; } main { border-radius:22px; padding:30px 22px 34px; } .logo { margin-bottom:30px; } }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 620 270" role="img" aria-labelledby="logo-title logo-desc"><title id="logo-title">MCN Elektrotechniek</title><desc id="logo-desc">Oranje MCN-letters met een blauwe bliksemflits.</desc><rect width="620" height="270" rx="12" fill="#0b0b0b"/><g fill="none" stroke="#444" stroke-width="2" opacity=".3"><path d="M150 12c180 15 250 80 390 92M105 32c190 5 285 85 445 110M80 55c190 0 320 90 460 135"/></g><text x="95" y="177" fill="#ff751b" font-family="Arial Black,Arial,sans-serif" font-size="205" font-style="italic" font-weight="900" letter-spacing="-16">MCN</text><path d="M139 24 79 135l55-14-39 114 111-145-56 15 34-83z" fill="#35a9eb"/><text x="79" y="243" fill="#ff751b" font-family="Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1">ELEKTROTECHNIEK</text></svg>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Vernieuwde website</div>
    <h1>Binnenkort<br><span>beschikbaar</span></h1>
    <p>We werken aan onze nieuwe website. MCN Elektrotechniek is binnenkort weer online met een vernieuwde website.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>MCN Elektrotechniek</footer>
  </main>
</body>
</html>
